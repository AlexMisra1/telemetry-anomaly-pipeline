version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pipeline-net

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=backend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge
